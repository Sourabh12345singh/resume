services:
  python-service:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: jobhunter-python
    image: jobhunter-python:latest
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobhunter-backend
    image: jobhunter-backend:latest
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PYTHON_SERVICE_URL=http://python-service:5000
    depends_on:
      python-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobhunter-frontend
    image: jobhunter-frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
